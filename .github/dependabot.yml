version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      pre-commit:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    ignore:
      # 2.27+ rewrites the zero-padded CalVer in project.version
      - dependency-name: "https://github.com/tox-dev/pyproject-fmt"
        versions: [ ">=2.27" ]
